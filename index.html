<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>TOUGE BATTLE</title><style>*{box-sizing:border-box}body{margin:0;background:#111;color:white;font:14px system-ui;overflow:hidden;touch-action:none}canvas{display:block}#hud{position:absolute;top:12px;left:15px;right:15px;display:flex;justify-content:space-between;text-shadow:0 2px 4px black;pointer-events:none}#speed{font-size:36px;font-weight:800}#controls{position:absolute;bottom:14px;left:14px;right:14px;display:flex;justify-content:space-between}button{touch-action:none;color:white;background:#18232cbb;border:1px solid #ffffff88;border-radius:12px;width:70px;height:64px;font-weight:bold;font-size:18px}button.on{background:#c56b35}#reset{width:auto;height:32px;font-size:12px;pointer-events:auto}#msg{position:absolute;top:42%;width:100%;text-align:center;pointer-events:none;font-size:18px;padding:0 20px;text-shadow:0 2px 5px black}</style><div id="hud"><div><b>TOUGE / 山岳試走</b><br><span id="dist"></span><br><span id="time"></span></div><div><span id="speed">0</span> km/h<br><span id="gear"></span> <button id="reset">RESET</button></div></div><div id="msg">読み込み中…</div><div id="controls"><div><button data-k="l">◀</button> <button data-k="r">▶</button></div><div><button data-k="b">BRAKE</button> <button data-k="a">GAS</button></div></div><script>
(async function(){const msg=document.getElementById('msg');try{const T=await import('./three.module.js');const scene=new T.Scene();scene.background=new T.Color(0xa8c8df);scene.fog=new T.FogExp2(0xa8c8df,.003);const camera=new T.PerspectiveCamera(65,innerWidth/innerHeight,.1,800);const renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);document.body.prepend(renderer.domElement);scene.add(new T.HemisphereLight(0xeaf5ff,0x68704c,2));const sun=new T.DirectionalLight(0xfff2d5,2.2);sun.position.set(-40,70,25);scene.add(sun);
const pts=[[0,60,0],[0,57,-100],[35,53,-180],[110,49,-240],[140,45,-320],[90,41,-390],[0,37,-420],[-75,33,-490],[-65,29,-570],[20,25,-620],[110,21,-600],[150,17,-540],[115,13,-485],[45,9,-490],[-5,5,-550],[-30,1,-650],[-100,-3,-740],[-200,-7,-780],[-270,-11,-850],[-250,-15,-950],[-160,-19,-1030],[-60,-23,-1050],[20,-27,-1130],[0,-31,-1250]].map(p=>new T.Vector3(...p));const path=new T.CatmullRomCurve3(pts);path.arcLengthDivisions=4000;path.updateArcLengths();const len=path.getLength(),N=Math.ceil(len/2),up=new T.Vector3(0,1,0);
function sample(s){let u=T.MathUtils.clamp(s/len,0,1),p=path.getPointAt(u),f=path.getTangentAt(u).normalize(),r=new T.Vector3().crossVectors(f,up).normalize();return {p,f,r}}
function mat(c,rough=1){return new T.MeshStandardMaterial({color:c,roughness:rough,side:T.DoubleSide})}
function ribbon(offsets,height,color){let v=[],idx=[],n=offsets.length;for(let i=0;i<=N;i++){let {p,r}=sample(i/N*len);for(let j=0;j<n;j++){let d=offsets[j],q=p.clone().addScaledVector(r,d);q.y+=height(d,i,j);v.push(q.x,q.y,q.z)}if(i<N)for(let j=0;j<n-1;j++){let k=i*n+j;idx.push(k,k+n,k+1,k+1,k+n,k+n+1)}}let geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(v,3));geo.setIndex(idx);geo.computeVertexNormals();scene.add(new T.Mesh(geo,mat(color)))}
function strip(a,b,h,c){ribbon([a,b],()=>h,c)}
strip(-4.1,4.1,-.04,0x77736a);strip(-3.5,3.5,0,0x45494c);strip(-3.35,-3.25,.015,0xe7e7dc);strip(3.25,3.35,.015,0xe7e7dc);strip(-.055,.055,.018,0xd7b05a);strip(-4.1,-3.9,.65,0xb5bdbe);strip(3.9,4.1,.65,0xb5bdbe);
for(let sign of [-1,1])ribbon([4.1,8,16,30,55,90,150].map(x=>x*sign),(d,i,j)=>j===0?-.1:sign*(Math.abs(d)-4)*.32+Math.sin(i*.065+j)*j*1.1,sign<0?0x526e39:0x647c43);
function box(w,h,d,m,x,y,z,parent=scene){let o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);parent.add(o);return o}
const dummy=new T.Object3D(),count=Math.ceil(len/5)*2,posts=new T.InstancedMesh(new T.BoxGeometry(.12,.85,.12),mat(0x929a9b),count),trees=new T.InstancedMesh(new T.ConeGeometry(2.3,8,7),mat(0x294d2d),count),trunks=new T.InstancedMesh(new T.CylinderGeometry(.16,.24,3,6),mat(0x64503a),count);let k=0;
for(let s=0;s<len;s+=5)for(let sign of [-1,1]){let {p,r}=sample(s);dummy.scale.setScalar(1);dummy.position.copy(p).addScaledVector(r,sign*4);dummy.position.y+=.35;dummy.updateMatrix();posts.setMatrixAt(k,dummy.matrix);let d=9+7*(1+Math.sin(k*127.1));dummy.position.copy(p).addScaledVector(r,d*sign);dummy.position.y+=sign*(d-4)*.32+1.3;dummy.updateMatrix();trunks.setMatrixAt(k,dummy.matrix);dummy.position.y+=4;dummy.scale.setScalar(.75+.3*Math.abs(Math.sin(k*8)));dummy.updateMatrix();trees.setMatrixAt(k++,dummy.matrix)}scene.add(posts,trees,trunks);
const car=new T.Group();scene.add(car);const paint=mat(0x315d87,.25),glass=mat(0x152a38,.2),black=mat(0x141619),red=mat(0xb91c26,.35),silver=mat(0xb5b8ba,.35);
function shell(sections,m){let v=[],idx=[];for(let [z,w,y0,y1,top] of sections)v.push(-w,y0,z,w,y0,z,w*top,y1,z,-w*top,y1,z);for(let i=0;i<sections.length-1;i++)for(let j=0;j<4;j++){let a=i*4+j,b=i*4+(j+1)%4;idx.push(a,b,a+4,b,b+4,a+4)}idx.push(0,2,1,0,3,2);let n=(sections.length-1)*4;idx.push(n,n+1,n+2,n,n+2,n+3);let geo=new T.BufferGeometry();geo.setAttribute('position',new T.Float32BufferAttribute(v,3));geo.setIndex(idx);geo.computeVertexNormals();car.add(new T.Mesh(geo,m))}
shell([[-2.25,.82,.27,.66,.92],[-1.7,.88,.23,.77,.96],[-.6,.88,.23,.82,.96],[.9,.88,.23,.82,.96],[1.8,.86,.23,.76,.96],[2.22,.79,.29,.65,.95]],paint);shell([[-.95,.77,.77,.79,.95],[-.35,.72,.79,1.32,.79],[.55,.72,.79,1.31,.79],[1.4,.77,.77,.80,.96]],glass);box(1.14,.07,.92,paint,0,1.32,.1,car);for(let x of [-.69,.69]){box(.075,.5,.09,paint,x,1.03,.5,car);box(.19,.13,.28,paint,x*1.32,.87,-.58,car)}box(1.65,.15,.13,black,0,.43,2.2,car);for(let x of [-.54,.54]){box(.56,.16,.06,red,x,.69,2.19,car);box(.53,.12,.06,silver,x,.64,-2.22,car)}box(.36,.15,.04,silver,0,.49,2.28,car);box(1.5,.07,.28,paint,0,.94,1.95,car);for(let x of [-.58,.58])box(.09,.17,.12,paint,x,.85,1.95,car);const wheels=[];for(let x of [-.88,.88])for(let z of [-1.38,1.4]){let pivot=new T.Group();pivot.position.set(x,.36,z);car.add(pivot);let wheel=new T.Mesh(new T.CylinderGeometry(.35,.35,.23,24),black);wheel.rotation.z=Math.PI/2;pivot.add(wheel);let rim=new T.Mesh(new T.CylinderGeometry(.23,.23,.245,16),silver);rim.rotation.z=Math.PI/2;pivot.add(rim);wheels.push({pivot,z})}
let s=5,v=0,lane=-1.1,lat=0,steer=0,elapsed=0,keys={},done=false;function reset(){s=5;v=0;lane=-1.1;lat=steer=elapsed=0;done=false;msg.textContent='GASを長押ししてスタート'}reset();document.getElementById('reset').onclick=reset;document.querySelectorAll('[data-k]').forEach(b=>{let k=b.dataset.k;b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys[k]=true;b.classList.add('on')};b.onpointerup=b.onpointercancel=b.onlostpointercapture=()=>{keys[k]=false;b.classList.remove('on')}});let km={ArrowUp:'a',ArrowDown:'b',ArrowLeft:'l',ArrowRight:'r'};window.onkeydown=e=>{if(km[e.key]){e.preventDefault();keys[km[e.key]]=true}};window.onkeyup=e=>{keys[km[e.key]]=false};window.onblur=()=>keys={};window.onresize=()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)};let last=performance.now();function frame(now){let dt=Math.min(.04,(now-last)/1000);last=now;let a=sample(s),b=sample(s+8),bend=a.f.clone().cross(b.f).y/8;let input=(keys.r?1:0)-(keys.l?1:0);steer+=(input-steer)*Math.min(1,dt*5);if(!done){v=Math.max(0,Math.min(48,v+dt*((keys.a?7.5:0)-(keys.b?15:0)-.35-v*v*.0028)));if(v>.2){elapsed+=dt;msg.textContent=''}let target=steer*v*.22+bend*v*v*.12;lat+=(target-lat)*Math.min(1,dt*4);lane+=lat*dt;if(Math.abs(lane)>2.65){lane=Math.sign(lane)*2.65;v*=Math.exp(-dt*2.5);lat=0} s+=v*dt;if(s>=len-3){done=true;v=0;msg.textContent='FINISH  '+elapsed.toFixed(2)+' 秒'}}a=sample(s);car.position.copy(a.p).addScaledVector(a.r,lane);car.position.y+=.035;car.rotation.set(Math.asin(a.f.y),Math.atan2(-a.f.x,-a.f.z)-steer*.10,-steer*v*.0015);for(let w of wheels)if(w.z<0)w.pivot.rotation.y=-steer*.3;let cp=car.position.clone().addScaledVector(a.f,-7.5).add(new T.Vector3(0,3.3,0));camera.position.lerp(cp,1-Math.exp(-dt*8));camera.lookAt(car.position.clone().addScaledVector(a.f,8).add(new T.Vector3(0,.8,0)));document.getElementById('speed').textContent=Math.round(v*3.6);document.getElementById('gear').textContent=Math.min(6,1+Math.floor(v/8))+' AT';document.getElementById('dist').textContent=(s/1000).toFixed(2)+' / '+(len/1000).toFixed(2)+' km';document.getElementById('time').textContent=elapsed.toFixed(2)+' s';renderer.render(scene,camera);requestAnimationFrame(frame)}camera.position.set(0,64,10);requestAnimationFrame(frame);
}catch(e){msg.textContent='起動できません: '+e.message}
})();
</script></html>
