name: Rin AI training
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/ai-training.yml'
permissions:
  contents: read
concurrency:
  group: rin-training
  cancel-in-progress: false
jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --prefix training --no-save --no-package-lock three@0.160.0
      - name: Smoke test
        run: node --check training/train-neural.mjs
      - name: Train
        run: node training/train-neural.mjs 40
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rin-neural-pilot-results
          path: training/results/
          retention-days: 14
